---
- name: Check if cluster is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_admin_conf

- name: Initialize Kubernetes cluster
  command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --service-cidr={{ service_cidr }}
  register: kubeadm_init
  when: not k8s_admin_conf.stat.exists

- name: Set home directory path
  set_fact:
    user_home: "{{ '/root' if ansible_user == 'root' else '/home/' + ansible_user }}"

- name: Create .kube directory for user
  file:
    path: "{{ user_home }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy admin.conf to user's .kube/config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ user_home }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Deploy Flannel network
  command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home }}/.kube/config"
  when: not k8s_admin_conf.stat.exists

- name: Generate join command for worker nodes
  command: kubeadm token create --print-join-command
  register: join_command_raw
  changed_when: false

- name: Set join command as a fact
  set_fact:
    join_command: "{{ join_command_raw.stdout }}"
