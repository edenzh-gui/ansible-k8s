---
# =============================================================================
# Debian / Ubuntu：通过 pkgs.k8s.io APT 仓库安装 kubelet / kubeadm / kubectl
# =============================================================================
- name: Install apt-transport-https and curl (Debian)
  apt:
    name:
      - apt-transport-https
      - curl
    state: present

- name: Ensure keyrings directory exists (Debian)
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Kubernetes GPG key (Debian)
  get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/Release.key"
    dest: /tmp/k8s.key
    mode: '0644'
  changed_when: false

- name: Convert Kubernetes GPG key to trusted gpg (Debian)
  command: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/k8s.key
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes apt repository (Debian)
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/ /"
    state: present
    filename: kubernetes

- name: Install kubelet, kubeadm, kubectl (Debian)
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes

- name: Hold kubernetes packages (prevent unintended upgrades) (Debian)
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Enable and start kubelet (Debian)
  systemd:
    name: kubelet
    enabled: yes
    state: started
