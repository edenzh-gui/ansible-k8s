---
# =============================================================================
# 通用：禁用 Swap
# =============================================================================
- name: Disable SWAP in fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: Disable SWAP on the fly
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

# =============================================================================
# RedHat 系：关闭 SELinux（避免 K8s 网络策略冲突）
# =============================================================================
- name: Set SELinux to permissive mode (RedHat family)
  selinux:
    policy: targeted
    state: permissive
  when: ansible_os_family == "RedHat"

- name: Persist SELinux permissive in config (RedHat family)
  replace:
    path: /etc/selinux/config
    regexp: '^SELINUX=enforcing'
    replace: 'SELINUX=permissive'
  when:
    - ansible_os_family == "RedHat"
    - ansible_selinux.status is defined

# =============================================================================
# RedHat 系：关闭 firewalld（由 K8s 网络插件接管）
# =============================================================================
- name: Stop and disable firewalld (RedHat family)
  systemd:
    name: firewalld
    state: stopped
    enabled: no
  when:
    - ansible_os_family == "RedHat"
    - ansible_facts.services['firewalld.service'] is defined
  ignore_errors: yes

# =============================================================================
# 通用：加载 K8s 所需内核模块
# =============================================================================
- name: Ensure modules-load directory exists
  file:
    path: /etc/modules-load.d
    state: directory

- name: Add kernel modules to load at boot
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Load kernel modules immediately
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

# =============================================================================
# 通用：配置 sysctl 网络转发参数
# =============================================================================
- name: Set sysctl parameters for Kubernetes
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Apply sysctl params without reboot
  command: sysctl --system
