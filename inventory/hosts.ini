# =============================================================================
# Kubernetes 集群主机清单
# 高可用模式：配置 3 个 kube_master 节点即可自动启用 HA
# 单 Master 模式：保留 1 个 kube_master 节点即可（向后兼容）
# =============================================================================

[kube_master]
master1 ansible_host=192.168.9.41 keepalived_priority=100
# HA 模式：取消下面两行注释，并填入真实 IP
# master2 ansible_host=192.168.9.44 keepalived_priority=90
# master3 ansible_host=192.168.9.45 keepalived_priority=80

[kube_node]
worker1 ansible_host=192.168.9.42
worker2 ansible_host=192.168.9.43

# HA 模式：HAProxy 和 Keepalived 部署在所有 Master 节点上
[haproxy:children]
kube_master

[keepalived:children]
kube_master

[k8s_cluster:children]
kube_master
kube_node

# =============================================================================
# 全局登录配置
# =============================================================================
[all:vars]
ansible_user=root
# 密码登录（如使用 SSH 密钥，注释掉此行）
ansible_ssh_pass=2220
# 若使用非 root 用户需要 sudo：
# ansible_become_pass=YOUR_SUDO_PASSWORD
# 若使用 SSH 私钥：
# ansible_ssh_private_key_file=~/.ssh/id_rsa
