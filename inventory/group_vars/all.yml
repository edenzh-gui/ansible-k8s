---
# =============================================================================
# Kubernetes 版本配置
# 修改 k8s_minor_version 即可切换版本（如 "1.29"、"1.30"、"1.31" 等）
# =============================================================================
k8s_minor_version: "1.36"
k8s_version: "{{ k8s_minor_version }}.*"

# =============================================================================
# 网络配置
# =============================================================================
# Pod 虚拟网络 CIDR，Flannel 默认要求使用 10.244.0.0/16
pod_network_cidr: "10.244.0.0/16"

# Service 虚拟网络 CIDR
service_cidr: "10.96.0.0/12"

# =============================================================================
# kube-proxy 代理模式
# ipvs：生产推荐，内核级哈希查找，支持多种负载均衡算法
# iptables：默认模式，Service 数量多时性能下降
# =============================================================================
kube_proxy_mode: "ipvs"

# =============================================================================
# 高可用（HA）配置
# 当 kube_master 组中节点数 > 1 时，HA 模式自动生效
# =============================================================================

# 虚拟 IP（VIP）：必须是同网段内一个未被使用的空闲 IP
ha_vip_ip: "192.168.9.100"

# VIP 绑定的网卡名（使用 ip addr 或 ifconfig 查看，通常是 eth0 或 ens18 等）
ha_vip_interface: "ens33"

# 负载均衡器监听端口（与 APIServer 端口 6443 错开，避免冲突）
ha_lb_port: 16443

# =============================================================================
# CNI 网络插件配置
# =============================================================================
cni_plugin: "flannel"   # 当前支持 flannel
